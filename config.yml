# Denicheur de vols pas chers - departs Montpellier (priorite), Toulouse, Marseille, Barcelone, Paris.
# Source de prix : Travelpayouts (Aviasales), prix en cache. Token via la variable TRAVELPAYOUTS_TOKEN.

origins:
  - code: MPL
    earliest_departure: "00:00"   # 00:00 = pas de contrainte d'horaire
  - code: TLS
    earliest_departure: "00:00"
  - code: MRS
    earliest_departure: "00:00"
  - code: BCN
    earliest_departure: "00:00"
  - code: PAR                     # code "ville" Paris (CDG + Orly). Si erreur, remplacer par CDG
    earliest_departure: "00:00"

destinations:
  # "domestic" = destinations en France
  domestic:
    - code: NCE
      name: Nice
      date_windows: &w4           # sejours de 4 jours (city-trips, week-ends)
        - {depart_start: "2026-11-01", depart_end: "2026-12-31", trip_length_days: 4}
        - {depart_start: "2027-01-01", depart_end: "2027-02-28", trip_length_days: 4}
        - {depart_start: "2027-03-01", depart_end: "2027-04-30", trip_length_days: 4}
        - {depart_start: "2027-05-01", depart_end: "2027-06-30", trip_length_days: 4}
    - {code: AJA, name: Ajaccio, date_windows: *w4}
    - {code: BIA, name: Bastia, date_windows: *w4}
    - {code: BOD, name: Bordeaux, date_windows: *w4}
    - {code: NTE, name: Nantes, date_windows: *w4}
    - {code: LYS, name: Lyon, date_windows: *w4}
    - {code: LIL, name: Lille, date_windows: *w4}
    - {code: RNS, name: Rennes, date_windows: *w4}
    - {code: BES, name: Brest, date_windows: *w4}
    - {code: CFR, name: Caen, date_windows: *w4}
    - {code: SXB, name: Strasbourg, date_windows: *w4}

  # "international" = tout le reste
  international:
    - code: LIS
      name: Lisbonne
      date_windows: &w5           # sejours de 5 jours
        - {depart_start: "2026-11-01", depart_end: "2026-12-31", trip_length_days: 5}
        - {depart_start: "2027-01-01", depart_end: "2027-02-28", trip_length_days: 5}
        - {depart_start: "2027-03-01", depart_end: "2027-04-30", trip_length_days: 5}
        - {depart_start: "2027-05-01", depart_end: "2027-06-30", trip_length_days: 5}
    - {code: OPO, name: Porto, date_windows: *w5}
    - {code: MAD, name: Madrid, date_windows: *w5}
    - {code: SVQ, name: Seville, date_windows: *w5}
    - {code: AGP, name: Malaga, date_windows: *w5}
    - {code: PMI, name: Palma de Majorque, date_windows: *w5}
    - {code: IBZ, name: Ibiza, date_windows: *w5}
    - {code: FCO, name: Rome, date_windows: *w5}
    - {code: NAP, name: Naples, date_windows: *w5}
    - {code: VCE, name: Venise, date_windows: *w5}
    - {code: MXP, name: Milan, date_windows: *w5}
    - {code: CTA, name: Catane, date_windows: *w5}
    - {code: PMO, name: Palerme, date_windows: *w5}
    - {code: MLA, name: Malte, date_windows: *w5}
    - {code: ATH, name: Athenes, date_windows: *w5}
    - {code: SPU, name: Split, date_windows: *w5}
    - {code: DBV, name: Dubrovnik, date_windows: *w5}
    - {code: BER, name: Berlin, date_windows: *w5}
    - {code: MUC, name: Munich, date_windows: *w5}
    - {code: PRG, name: Prague, date_windows: *w5}
    - {code: BUD, name: Budapest, date_windows: *w5}
    - {code: VIE, name: Vienne, date_windows: *w5}
    - {code: KRK, name: Cracovie, date_windows: *w5}
    - {code: DUB, name: Dublin, date_windows: *w5}
    - {code: EDI, name: Edimbourg, date_windows: *w5}
    - {code: LON, name: Londres, date_windows: *w5}
    - {code: AMS, name: Amsterdam, date_windows: *w5}
    - {code: BRU, name: Bruxelles, date_windows: *w5}
    - {code: CPH, name: Copenhague, date_windows: *w5}
    - {code: ARN, name: Stockholm, date_windows: *w5}
    - {code: KEF, name: Reykjavik, date_windows: *w5}
    - {code: MAH, name: Minorque, date_windows: *w5}
    - {code: BSL, name: Bale-Mulhouse, date_windows: *w5}
    - {code: MAN, name: Manchester, date_windows: *w5}
    - code: RAK
      name: Marrakech
      date_windows: &w7           # sejours de 7 jours (plus loin / soleil)
        - {depart_start: "2026-11-01", depart_end: "2026-12-31", trip_length_days: 7}
        - {depart_start: "2027-01-01", depart_end: "2027-02-28", trip_length_days: 7}
        - {depart_start: "2027-03-01", depart_end: "2027-04-30", trip_length_days: 7}
        - {depart_start: "2027-05-01", depart_end: "2027-06-30", trip_length_days: 7}
    - {code: AGA, name: Agadir, date_windows: *w7}
    - {code: CMN, name: Casablanca, date_windows: *w7}
    - {code: TUN, name: Tunis, date_windows: *w7}
    - {code: IST, name: Istanbul, date_windows: *w7}
    - {code: TFS, name: Tenerife Sud, date_windows: *w7}
    - {code: LPA, name: Grande Canarie, date_windows: *w7}
    - {code: FAO, name: Faro, date_windows: *w7}
    - {code: CAI, name: Le Caire, date_windows: *w7}
    - {code: ACE, name: Lanzarote, date_windows: *w7}
    - {code: DJE, name: Djerba, date_windows: *w7}
    - {code: ORN, name: Oran, date_windows: *w7}
    - {code: RBA, name: Rabat, date_windows: *w7}
    - {code: TNG, name: Tanger, date_windows: *w7}
    - {code: FEZ, name: Fes, date_windows: *w7}

filters:
  # Le nom du champ garde "usd" (code d'origine) mais la valeur est en EUR
  # puisque search.currency est eur. A verifier au premier passage.
  max_price_usd: 200              # plafond aller-retour par personne
  max_stops: 1
  blocked_carriers: []            # aucune : les low-cost (Ryanair, Vueling, easyJet...) sont voulues

api_budget:
  monthly_max_calls: 25000

# Par passage : 5 origines x (2 France + 4 international) x 4 fenetres x 2 mois = ~240 appels
# 3 passages/jour = ~21 600 appels/mois, sous le plafond ci-dessus.
# Tour complet des 60 destinations : environ 10 passages (3 a 4 jours).
rotation:
  domestic_per_run: 2
  international_per_run: 4
  windows_per_run: 4   # le code prend les N premieres fenetres de chaque destination

search:
  currency: eur

ranking:
  history_days: 30
  min_history_offers: 8

alerts:
  threshold_dedupe_hours: 24
  max_threshold_alerts_per_run: 5
